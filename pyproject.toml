[project]
name = "dcd-lago"
version = "1.2.1"
description = "Python implementation of the LAGO method for dynamic community detection on temporal networks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name="Victor Brabant", email="victorbrabant@gmail.com" }
]
keywords = ["lago", "networks", "temporal networks", "modularity", "structures"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]

# The algorithm and the metric depend on the standard library only.
dependencies = []

[project.optional-dependencies]
# Visualization extras - for plotting modules
viz = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
]
# All extras
all = [
    "dcd-lago[viz]",
]
# Development dependencies: tests, lint, and the in-place compiled build
# (`python setup.py build_ext --inplace`); psutil lets n_jobs cap itself on memory.
dev = [
    "pytest>=7.0",
    "numpy>=1.24",  # a reference in tests/metrics/test_l_modularity.py
    "ruff>=0.1",
    "Cython>=3.1,<4",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/fondationsahar/dynamic_community_detection"
Issues = "https://github.com/fondationsahar/dynamic_community_detection/issues"

[build-system]
# Cython compiles the hot modules and the metric kernel at build time (setup.py);
# it is never needed at runtime, and a build without a C compiler still yields
# a working pure-Python install.
requires = ["setuptools>=61", "wheel", "Cython>=3.1,<4"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The wheel carries the .py sources, the .so built from them, and the Cython
# declarations -- not the generated C, which belongs to the sdist (MANIFEST.in).
include-package-data = false

[tool.setuptools.package-data]
lago = ["*.pxd", "*.pyx"]
"lago.algorithm._internal" = ["*.pxd"]

[tool.setuptools.packages.find]
include = ["lago*"]

[tool.cibuildwheel]
# The release's binary wheels (.github/workflows/wheels.yml). Everything they do
# not cover -- PyPy, Pyodide, other architectures -- takes the py3-none-any wheel
# built beside them with LAGO_PURE=1, which is the same code run as Python.
#
# Not built: free-threaded CPython (compiled modules would turn the GIL back on,
# and the search is single-threaded) and 32-bit x86, where x87 arithmetic keeps
# a running sum at 80 bits and the kernel would stop matching the Python loops
# bit for bit.
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp315-*"]
skip = ["cp31?t-*", "*-win32", "*_i686"]
# A failed compile fails the build: a platform wheel is compiled or not shipped.
environment = { LAGO_REQUIRE_COMPILED = "1" }
# Each wheel is tested as installed, from a copy of these outside the checkout:
# the suite with every compiled module asserted present (tests/core/test_build.py),
# then the compiled variants held bit for bit to the pure-Python ones.
test-sources = ["tests", "benchmarks", "setup.py"]
test-requires = ["pytest", "numpy"]
test-environment = { LAGO_EXPECT_COMPILED = "1", LAGO_BENCH_INSTALLED = "1" }
test-command = [
    "python -m pytest tests -q -p no:cacheprovider --ignore=tests/test_viz",
    "python benchmarks/compare_backends.py -n 200 --require-compiled",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["lago"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
