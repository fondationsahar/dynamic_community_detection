[project]
name = "dcd-lago"
version = "1.2.0"
description = "Python implementation of the LAGO method for dynamic community detection on temporal networks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name="Victor Brabant", email="victorbrabant@gmail.com" }
]
keywords = ["lago", "networks", "temporal networks", "modularity", "structures"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# The algorithm and the metric depend on the standard library only.
dependencies = []

[project.optional-dependencies]
# Visualization extras - for plotting modules
viz = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
]
# All extras
all = [
    "dcd-lago[viz]",
]
# Development dependencies: tests, lint, and the in-place compiled build
# (`python setup.py build_ext --inplace`); psutil lets n_jobs cap itself on memory.
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "Cython>=3.0",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/fondationsahar/dynamic_community_detection"
Issues = "https://github.com/fondationsahar/dynamic_community_detection/issues"

[build-system]
# Cython compiles the hot modules and the metric kernel at build time (setup.py);
# it is never needed at runtime, and a build without a C compiler still yields
# a working pure-Python install.
requires = ["setuptools>=61", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The wheel carries the .py sources, the .so built from them, and the Cython
# declarations -- not the generated C, which belongs to the sdist (MANIFEST.in).
include-package-data = false

[tool.setuptools.package-data]
lago = ["*.pxd", "*.pyx"]
"lago.algorithm._internal" = ["*.pxd"]

[tool.setuptools.packages.find]
include = ["lago*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["lago"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
