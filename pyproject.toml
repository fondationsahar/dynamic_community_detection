[project]
name = "dcd-lago"
version = "1.0.3"
description = "Python implementation of the LAGO method for dynamic community detection on temporal networks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name="Victor Brabant", email="victorbrabant@gmail.com" }
]
keywords = ["lago", "networks", "temporal networks", "modularity", "structures"]
[project.urls]
Homepage = "https://github.com/fondationsahar/dynamic_community_detection"
Issues = "https://github.com/fondationsahar/dynamic_community_detection/issues"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lago*"]
