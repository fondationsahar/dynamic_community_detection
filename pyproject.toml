[project]
name = "dcd-lago"
version = "1.1.0"
description = "Python implementation of the LAGO method for dynamic community detection on temporal networks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name="Victor Brabant", email="victorbrabant@gmail.com" }
]
keywords = ["lago", "networks", "temporal networks", "modularity", "structures"]

# Core dependencies - minimal for algorithm-only use
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Visualization extras - for plotting modules
viz = [
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
]
# All extras
all = [
    "dcd-lago[viz]",
]
# Development dependencies
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/fondationsahar/dynamic_community_detection"
Issues = "https://github.com/fondationsahar/dynamic_community_detection/issues"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lago*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["lago"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
